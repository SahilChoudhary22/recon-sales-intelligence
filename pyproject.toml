[project]
name = "recon-sales-intelligence"
version = "0.1.0"
description = "Cybersecurity sales intelligence from internet scan data: which companies need security help now, and why"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "mcp>=2.3.0",
    "orjson>=3.13.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pytest>=9.2.0",
    "streamlit>=1.66.1",
    "tldextract>=5.4.0",
    "zstandard>=0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
