# public through an ngrok static domain: a per-client rate limit on the API keeps one caller from
# monopolising it; everything else is static.
# Visitors reach nginx through the ngrok (or Tailscale) container, so the connection's address is that
# container's for everyone. Take the visitor's own address from X-Forwarded-For when the request comes
# from the compose network, or every visitor would share one rate-limit bucket.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mcp:10m rate=5r/s;
limit_req_status 429;

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml text/csv;
    gzip_min_length 1024;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location /assets/ { expires 7d; }
    location = /api/login {
        limit_req zone=login burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://api:8787;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # MCP over HTTP (bearer token checked by the app); every call is one POST with a JSON reply
    location = /mcp {
        limit_req zone=mcp burst=20 nodelay;
        client_max_body_size 256k;
        proxy_pass http://api:8787;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        limit_req zone=api burst=120 nodelay;
        client_max_body_size 512k;
        proxy_pass http://api:8787;
        proxy_read_timeout 30s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { try_files $uri $uri/ /index.html; }
}
