# public through Tailscale Funnel: a per-client rate limit on the API keeps one caller from
# monopolising it; everything else is static
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=mcp:10m rate=5r/s;

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml text/csv;
    gzip_min_length 1024;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location /assets/ { expires 7d; }
    location = /api/login {
        limit_req zone=login burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://api:8787;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # MCP over HTTP (bearer token checked by the app); every call is one POST with a JSON reply
    location = /mcp {
        limit_req zone=mcp burst=20 nodelay;
        client_max_body_size 256k;
        proxy_pass http://api:8787;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        client_max_body_size 512k;
        proxy_pass http://api:8787;
        proxy_read_timeout 30s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { try_files $uri $uri/ /index.html; }
}
