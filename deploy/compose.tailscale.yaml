# Put the site on the tailnet as its own node (https://<TS_HOSTNAME>.<tailnet>.ts.net), for private
# access and administration. The public URL is the ngrok static domain (compose.ngrok.yaml): from a
# home connection Funnel could only reach this node through distant relays, which was too slow.
# Needs TS_AUTHKEY in .env (a Tailscale auth key).
services:
  tailscale:
    image: tailscale/tailscale:v1.102.4
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: ${TS_HOSTNAME:-recon}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: 'true'
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    depends_on:
      - web

volumes:
  tailscale-state:
